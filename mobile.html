<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title></title>
		<style>
			* {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
				color: #ffffff;
				min-height: 100dvh;
				overflow: hidden;
				background-color: #0b1016;
				-webkit-tap-highlight-color: transparent;
			}

			/* 移动端背景适配：bg.jpg 是 1200×665 横图，竖屏用 cover 会裁掉主视觉文字，
			   因此分两层：底层高斯模糊铺满（消除黑边），上层海报图完整显示并羽化上下边缘。
			   竖屏时海报放大到 118% 宽度（只裁掉两侧冰霜边），让文字更大更清晰 */
			.bg-layer {
				position: fixed;
				inset: 0;
				z-index: -1;
				overflow: hidden;
				pointer-events: none;
			}

			.bg-blur {
				position: absolute;
				inset: -14%;
				background: url('bg.jpg') center center / cover no-repeat;
				filter: blur(26px) brightness(0.35) saturate(1.1);
			}

			.bg-poster {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 132%;
				aspect-ratio: 1200 / 665;
				transform: translate(-50%, -50%);
				background: url('bg.jpg') center center / cover no-repeat;
				-webkit-mask-image: linear-gradient(
					to bottom,
					transparent 0%,
					#000 20%,
					#000 80%,
					transparent 100%
				);
				mask-image: linear-gradient(
					to bottom,
					transparent 0%,
					#000 20%,
					#000 80%,
					transparent 100%
				);
			}

			/* 横屏时图片本身接近满屏，不再放大，避免裁掉主视觉 */
			@media (orientation: landscape) {
				.bg-poster {
					width: 100%;
				}
			}

			#snowCanvas {
				position: fixed;
				top: 0;
				left: 0;
				width: 100vw;
				height: 100vh;
				pointer-events: none;
				z-index: 1;
			}

			body.is-mobile {
				overflow-y: auto;
			}

			#board {
				position: relative;
				width: 100vw;
				height: 100dvh;
				overflow: hidden;
			}

			.card {
				position: absolute;
				width: 180px;
				border-radius: 13px;
				/* 冷调投影 + 顶部霜白高光 */
				box-shadow: 0 12px 26px rgba(18, 48, 78, 0.26),
					0 2px 5px rgba(18, 48, 78, 0.12),
					inset 0 1px 0 rgba(255, 255, 255, 0.9);
				background-color: #eef6ff;
				/* 冰面反光：左上霜白到右下冷蓝，叠在 JS 设置的底色之上 */
				background-image: linear-gradient(
					155deg,
					rgba(255, 255, 255, 0.85) 0%,
					rgba(255, 255, 255, 0.18) 42%,
					rgba(150, 190, 228, 0.25) 100%
				);
				border: 1px solid rgba(255, 255, 255, 0.75);
				overflow: hidden;
				opacity: 0;
				transform-origin: center;
				transition: transform 0.35s ease, opacity 0.35s ease, left 0.35s ease,
					top 0.35s ease, width 0.35s ease, height 0.35s ease,
					border-radius 0.35s ease;
			}

			.card.dragging {
				transition: none;
				box-shadow: 0 18px 36px rgba(12, 38, 64, 0.34),
					inset 0 1px 0 rgba(255, 255, 255, 0.9);
			}

			.card.maximized {
				box-shadow: 0 24px 48px rgba(8, 30, 52, 0.4);
			}

			.card-header {
				display: none;
			}

			.card-body {
				padding: 14px 15px;
				font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei',
					'Noto Sans SC', sans-serif;
				font-size: 14px;
				line-height: 1.65;
				font-weight: 500;
				letter-spacing: 0.03em;
				color: #2b4358;
				word-break: break-word;
			}

			/* 最终弹窗：浅霜雪底 + 特大号雪花，文字用深蓝保证对比度 */
			.card.final-card {
				border-radius: 20px;
				background-color: #f2f9ff;
				background-image: radial-gradient(
						circle at 32% 10%,
						#ffffff 0%,
						rgba(255, 255, 255, 0) 58%
					),
					linear-gradient(158deg, #ffffff 0%, #eaf5ff 46%, #d6eafb 100%);
				border: 1px solid rgba(160, 204, 238, 0.8);
				box-shadow: 0 22px 54px rgba(20, 52, 84, 0.3),
					0 0 54px rgba(178, 216, 248, 0.5),
					inset 0 1px 0 #ffffff;
			}

			/* 特大号雪花：保持正方形不被拉伸，铺满整卡并缓慢自转 */
			.final-snowflake {
				position: absolute;
				top: 50%;
				left: 50%;
				width: 150%;
				aspect-ratio: 1;
				/* translate 独立于 transform，可与自转动画同时生效 */
				translate: -50% -50%;
				pointer-events: none;
				animation: snowflakeSpin 90s linear infinite;
			}

			@keyframes snowflakeSpin {
				from {
					transform: rotate(0deg);
				}
				to {
					transform: rotate(360deg);
				}
			}

			@media (prefers-reduced-motion: reduce) {
				.final-snowflake {
					animation: none;
				}
			}

			.final-card-inner {
				position: relative;
				z-index: 1;
				/* 磨砂玻璃面板：四周留白露出雪花，面板本身保证文字清晰 */
				margin: 16px;
				padding: 20px 16px 18px;
				text-align: center;
				border-radius: 13px;
				background: rgba(255, 255, 255, 0.84);
				-webkit-backdrop-filter: blur(4px);
				backdrop-filter: blur(4px);
				box-shadow: 0 8px 20px rgba(70, 125, 170, 0.18),
					inset 0 1px 0 #ffffff;
			}

			/* 衬线体，贴合背景「冬将至 我与你」的书卷气质 */
			.final-title {
				font-family: 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC',
					'STSong', 'SimSun', serif;
				font-size: 24px;
				font-weight: 600;
				letter-spacing: 0.16em;
				text-indent: 0.16em;
				color: #1b4166;
				text-shadow: 0 1px 0 #ffffff;
			}

			.final-title::after {
				content: '';
				display: block;
				width: 40px;
				height: 1px;
				margin: 12px auto 0;
				background: linear-gradient(
					90deg,
					transparent,
					rgba(110, 165, 212, 0.65),
					transparent
				);
			}

			.final-text {
				margin-top: 14px;
				font-family: 'Songti SC', 'Noto Serif SC', 'Source Han Serif SC',
					'STSong', 'SimSun', serif;
				font-size: 12px;
				line-height: 1.9;
				letter-spacing: 0.03em;
				color: rgba(40, 78, 112, 0.92);
			}

			@media (max-width: 480px) {
				.card {
					width: min(72vw, 170px);
				}

				.card-body {
					padding: 12px 14px;
					font-size: 13px;
				}
			}

			#musicStatus {
				position: fixed;
				bottom: 20px;
				right: 20px;
				padding: 10px 20px;
				background: rgba(0, 0, 0, 0.7);
				color: #fff;
				border-radius: 20px;
				font-size: 14px;
				z-index: 10000;
				display: none;
			}

			#musicStatus.show {
				display: block;
			}
		</style>
	</head>
	<body>
		<div class="bg-layer" aria-hidden="true">
			<div class="bg-blur"></div>
			<div class="bg-poster"></div>
		</div>
		<div id="board"></div>
		<canvas id="snowCanvas"></canvas>
		<div id="musicStatus">🎵音乐</div>
		<audio id="bgMusic" loop preload="auto">
			<source src="background.mp3" type="audio/mpeg">
		</audio>

		<script>
			const isMobileDevice =
				window.matchMedia('(pointer: coarse)').matches ||
				window.innerWidth <= 768

			if (!isMobileDevice) {
				window.location.replace('index.html')
			}

			const board = document.getElementById('board')
			const messages = [
				'保持好心情',
				'多喝水哦',
				'今天辛苦啦',
				'早点休息',
				'记得吃水果',
				'少熬夜',
				'永远陪着你',
				'保持微笑呀',
				'愿所有烦恼都消失',
				'希望你做自己',
				'梦想总会实现',
				'相信自己',
				'也希望你少生气',
				'很多事情不要藏在心里',
				'有你的日子最甜蜜',
				'每天爱我多一点',
				'和你一起变老',
				'长大了一岁要更懂事了',
				'也希望你脾气好一点',
				'天气冷了，多穿衣服',
				'记得给自己放松',
				'每天都要元气满满',
				'今天也要好好爱自己',
				'适当休息一下',
				'今天也要开心哦',
				'记得早点睡觉',
				'记得吃早餐'
			]


			// 立冬色系：全部为高明度霜雪色调，保证深色文字可读
			const colors = [
				// 霜雪白
				'#f2f7fb', // 霜白
				'#eef3f8', // 雪雾
				'#f1f4f7', // 月白
				'#edf2f6', // 寒烟
				'#f3f6f9', // 初雪

				// 冰蓝
				'#e4effa', // 冰蓝
				'#e8f3fb', // 冰晶
				'#dfe8f3', // 烟蓝
				'#e6f0fa', // 湖冰
				'#dde9f5', // 深雾蓝

				// 青灰
				'#e2f4f6', // 淡青
				'#e5ecef', // 寒青
				'#e3f0ea', // 玉青
				'#e9eff0', // 晨雾
				'#e6f0ea', // 松针雪

				// 冷紫
				'#e9e7f5', // 微紫
				'#ece6f2', // 雾紫
				'#e4e4f2', // 夜雪紫
				'#eae8f4', // 暮光紫

				// 立冬暖意（极淡的暖色点缀）
				'#f4efe6', // 暖雪
				'#f6f0e8', // 姜茶
				'#f8e8ee', // 浅霞
				'#f5eae4', // 暖霜
				'#f7f1ea'  // 糯白
			]

			const cardStates = new WeakMap()
			const MAXIMIZED_LAYER = 1000000
			let activeMaximizedCard = null
			let isMobile = true
			const maxCards = 170
			const spawnInterval = 130
			const heartGatherDelay = 19000 // 23秒后开始汇聚
			const heartAnimationDuration = 5000 // 8秒汇聚动画
			const audioDuration = 33000 // 音频时长33秒
			let zIndexCursor = 200
			let animationTriggered = false
			let currentAnimationTimeouts = [] // 存储当前动画的所有定时器

			document.body.classList.add('is-mobile')

			// 获取元素
			const bgMusic = document.getElementById('bgMusic')
			const musicStatus = document.getElementById('musicStatus')

			// 进入页面即开始（1 秒后自动开始，或提前点击任意位置触发）
			let hasStarted = false
			const START_DELAY = 1000

			function hideMusicStatus() {
				setTimeout(() => {
					musicStatus.classList.remove('show')
				}, 3000)
			}

			function tryPlayMusic() {
				const playPromise = bgMusic.play()
				if (!playPromise || typeof playPromise.then !== 'function') return

				playPromise
					.then(() => {
						console.log('音乐开始播放')
						musicStatus.classList.add('show')
						hideMusicStatus()
					})
					.catch(error => {
						// 无用户手势时浏览器会拦截自动播放，等下一次点击再试
						console.warn('音乐播放被拦截，等待用户交互后重试:', error)
						document.addEventListener(
							'pointerdown',
							() => tryPlayMusic(),
							{ once: true }
						)
					})
			}

			function startExperience() {
				if (hasStarted) return
				hasStarted = true

				clearTimeout(autoStartTimer)
				document.removeEventListener('pointerdown', onFirstInteraction, true)
				document.removeEventListener('keydown', onFirstInteraction, true)

				tryPlayMusic()

				// 立即开始生成卡片
				startCardGeneration()
			}

			function onFirstInteraction() {
				startExperience()
			}

			const autoStartTimer = setTimeout(startExperience, START_DELAY)

			// 任意点击/触摸即可提前开始（用捕获阶段，避免被卡片拦截）
			document.addEventListener('pointerdown', onFirstInteraction, true)
			document.addEventListener('keydown', onFirstInteraction, true)

			// 监听音频错误
			bgMusic.addEventListener('error', (e) => {
				console.error('音频加载错误:', e)
			})

			// 监听音频播放状态
			bgMusic.addEventListener('play', () => {
				console.log('音频正在播放')
			})

			bgMusic.addEventListener('pause', () => {
				console.log('音频已暂停')
			})

			// 监听音频播放进度，当音频循环时重置动画
			let lastCurrentTime = 0
			bgMusic.addEventListener('timeupdate', () => {
				// 检测音频是否重新开始（从头播放）
				if (lastCurrentTime > 30 && bgMusic.currentTime < 3) {
					console.log('音频循环，重置动画')
					resetAndRestartAnimation()
				}
				lastCurrentTime = bgMusic.currentTime
			})

			function randomFrom(array) {
				return array[Math.floor(Math.random() * array.length)]
			}

			function clamp(value, min, max) {
				return Math.min(Math.max(value, min), max)
			}

			function generateHeartPoints(count) {
				const points = []
				const centerX = window.innerWidth / 2
				const centerY = window.innerHeight / 2

				const scaleFromHeight = (window.innerHeight * 0.78) / 30
				const maxWidth = window.innerWidth * 0.9
				let scale = scaleFromHeight
				if (scale * 32 > maxWidth) {
					scale = maxWidth / 32
				}

				for (let i = 0; i < count; i++) {
					const t = (i / count) * Math.PI * 2
					const x = 16 * Math.pow(Math.sin(t), 3)
					const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t))

					points.push({
						x: centerX + x * scale,
						y: centerY + y * scale
					})
				}

				return points
			}

			function triggerHeartAnimation() {
				if (animationTriggered) return
				animationTriggered = true

				const cards = Array.from(document.querySelectorAll('.card'))
				if (cards.length === 0) return

				const heartPoints = generateHeartPoints(cards.length)
				const centerX = window.innerWidth / 2
				const centerY = window.innerHeight / 2

				cards.forEach((card, index) => {
					const state = cardStates.get(card)
					if (!state || state.closing) return

					const point = heartPoints[index % heartPoints.length]
					const cardWidth = card.offsetWidth
					const cardHeight = card.offsetHeight

					card.style.pointerEvents = 'none'

					card.style.transition = `transform ${heartAnimationDuration}ms ease-in-out, opacity ${heartAnimationDuration}ms ease-in-out, left ${heartAnimationDuration}ms ease-in-out, top ${heartAnimationDuration}ms ease-in-out`

					state.left = point.x - cardWidth / 2
					state.top = point.y - cardHeight / 2
					state.scale = 0.3
					state.angle = 0

					card.style.left = `${state.left}px`
					card.style.top = `${state.top}px`
					applyTransform(card, state)
				})

				setTimeout(() => {
					showFinalCard({ centerX, centerY })
				}, heartAnimationDuration)
			}

			// 六角雪花路径（viewBox 100×100，中心 50,50），描边绘制，任意尺寸都不失真
			const SNOWFLAKE_SVG = `
				<svg class="final-snowflake" viewBox="0 0 100 100" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
					<g fill="none" stroke="url(#flakeGrad)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
						<defs>
							<linearGradient id="flakeGrad" x1="0" y1="0" x2="1" y2="1">
								<stop offset="0%" stop-color="#3f8fc8" stop-opacity="1" />
								<stop offset="55%" stop-color="#7cbbE4" stop-opacity="1" />
								<stop offset="100%" stop-color="#a8d5f0" stop-opacity="0.92" />
							</linearGradient>
						</defs>
						<!-- 6 条主枝 -->
						<g>
							<line x1="50" y1="50" x2="50" y2="2" /><line x1="50" y1="50" x2="91.6" y2="26" />
							<line x1="50" y1="50" x2="91.6" y2="74" /><line x1="50" y1="50" x2="50" y2="98" />
							<line x1="50" y1="50" x2="8.4" y2="74" /><line x1="50" y1="50" x2="8.4" y2="26" />
						</g>
						<!-- 中心六边形 -->
						<polygon points="50,40 58.7,45 58.7,55 50,60 41.3,55 41.3,45" />
						<!-- 每条主枝的分叉：两组侧枝 + 枝端小叉 -->
						<g>
							<line x1="50" y1="30" x2="41.7" y2="23.5" /><line x1="50" y1="30" x2="58.3" y2="23.5" />
							<line x1="50" y1="17" x2="44.5" y2="12" /><line x1="50" y1="17" x2="55.5" y2="12" />
							<line x1="77" y1="34" x2="70.4" y2="25.3" /><line x1="77" y1="34" x2="70.4" y2="42.7" />
							<line x1="88.6" y1="27" x2="84.4" y2="18.6" /><line x1="88.6" y1="27" x2="84.4" y2="35.4" />
							<line x1="77" y1="66" x2="70.4" y2="74.7" /><line x1="77" y1="66" x2="70.4" y2="57.3" />
							<line x1="88.6" y1="73" x2="84.4" y2="81.4" /><line x1="88.6" y1="73" x2="84.4" y2="64.6" />
							<line x1="50" y1="70" x2="41.7" y2="76.5" /><line x1="50" y1="70" x2="58.3" y2="76.5" />
							<line x1="50" y1="83" x2="44.5" y2="88" /><line x1="50" y1="83" x2="55.5" y2="88" />
							<line x1="23" y1="66" x2="29.6" y2="74.7" /><line x1="23" y1="66" x2="29.6" y2="57.3" />
							<line x1="11.4" y1="73" x2="15.6" y2="81.4" /><line x1="11.4" y1="73" x2="15.6" y2="64.6" />
							<line x1="23" y1="34" x2="29.6" y2="25.3" /><line x1="23" y1="34" x2="29.6" y2="42.7" />
							<line x1="11.4" y1="27" x2="15.6" y2="18.6" /><line x1="11.4" y1="27" x2="15.6" y2="35.4" />
						</g>
						<!-- 枝端菱形结晶 -->
						<g fill="url(#flakeGrad)" stroke="none">
							<circle cx="50" cy="2" r="1.8" /><circle cx="91.6" cy="26" r="1.8" /><circle cx="91.6" cy="74" r="1.8" />
							<circle cx="50" cy="98" r="1.8" /><circle cx="8.4" cy="74" r="1.8" /><circle cx="8.4" cy="26" r="1.8" />
						</g>
					</g>
				</svg>
			`

			function showFinalCard({ centerX, centerY }) {
				const card = document.createElement('div')
				card.className = 'card final-card'

				const cardWidth = 300

				card.style.left = `${centerX - cardWidth / 2}px`
				card.style.top = `${centerY}px`
				card.style.width = `${cardWidth}px`
				card.style.zIndex = MAXIMIZED_LAYER + 1
				card.style.pointerEvents = 'all'
				card.style.opacity = '0'
				card.style.transition = 'transform 600ms ease, opacity 600ms ease, top 600ms ease'

				card.innerHTML = `
					${SNOWFLAKE_SVG}
					<div class="final-card-inner">
						<h2 class="final-title">立冬快乐</h2>
						<p class="final-text">愿姑娘今天的心灵被阳光照耀。<br />愿你的每一天都充满希望和欢笑，<br />好运与你相伴，也与我一直在身边。</p>
					</div>
				`

				const state = {
					angle: 0,
					scale: 0.45,
					translateX: 0,
					translateY: 0,
					left: centerX - cardWidth / 2,
					top: centerY,
					maximized: false,
					closing: false
				}

				cardStates.set(card, state)
				applyTransform(card, state)
				board.appendChild(card)

				requestAnimationFrame(() => {
					const cardHeight = card.offsetHeight || 0
					const targetTop = centerY - cardHeight / 2

					state.top = targetTop
					card.style.top = `${state.top}px`

					state.scale = 1.05
					applyTransform(card, state)
					card.style.opacity = '1'

					setTimeout(() => {
						state.scale = 1
						applyTransform(card, state)
					}, 420)
				})

				// 点击卡片关闭
				card.addEventListener('click', event => {
					event.stopPropagation()
					card.style.opacity = '0'
					setTimeout(() => card.remove(), 350)
				})
			}

			function applyTransform(card, state) {
				const scale = state.scale ?? 1
				const translateX = state.translateX ?? 0
				const translateY = state.translateY ?? 0
				const angle = state.angle ?? 0
				card.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${angle}deg)`
			}

			function bringToFront(card) {
				if (card === activeMaximizedCard) {
					card.style.zIndex = MAXIMIZED_LAYER
					return
				}

				zIndexCursor += 1
				if (activeMaximizedCard && zIndexCursor >= MAXIMIZED_LAYER) {
					zIndexCursor = MAXIMIZED_LAYER - 1
				}

				card.style.zIndex = zIndexCursor
			}

			function setupCardInteractions(card) {
				// 卡片点击提升层级
				card.addEventListener('pointerdown', () => {
					bringToFront(card)
				})

				// 长按关闭卡片（移动端）
				let pressTimer = null
				card.addEventListener('touchstart', event => {
					pressTimer = setTimeout(() => {
						closeCard(card)
					}, 800) // 长按800ms关闭
				})

				card.addEventListener('touchend', () => {
					if (pressTimer) {
						clearTimeout(pressTimer)
						pressTimer = null
					}
				})

				card.addEventListener('touchmove', () => {
					if (pressTimer) {
						clearTimeout(pressTimer)
						pressTimer = null
					}
				})
			}

			function closeCard(card) {
				const state = cardStates.get(card)
				if (!state || state.closing) return
				if (card === activeMaximizedCard) {
					activeMaximizedCard = null
				}
				state.closing = true
				state.scale = 0.1
				card.style.opacity = '0'
				applyTransform(card, state)

				const handleTransitionEnd = event => {
					if (event.propertyName === 'opacity') {
						card.removeEventListener('transitionend', handleTransitionEnd)
						card.remove()
					}
				}

				card.addEventListener('transitionend', handleTransitionEnd)
			}

			function minimizeCard(card) {
				const state = cardStates.get(card)
				if (!state || state.closing) return

				const runMinimize = () => {
					state.closing = true
					bringToFront(card)
					const bottom = Math.max(window.innerHeight - 24, 0)
					const targetLeft = clamp(
						state.left,
						10,
						Math.max(window.innerWidth - card.offsetWidth - 10, 10)
					)

					state.left = targetLeft
					state.top = bottom
					state.scale = 0.12
					state.angle = 0
					card.style.left = `${targetLeft}px`
					card.style.top = `${bottom}px`
					card.style.opacity = '0.35'
					applyTransform(card, state)

					const handleTransitionEnd = event => {
						if (event.propertyName === 'transform') {
							card.removeEventListener('transitionend', handleTransitionEnd)
							card.remove()
						}
					}

					card.addEventListener('transitionend', handleTransitionEnd)
				}

				if (state.maximized) {
					activeMaximizedCard = null
					state.maximized = false
					card.classList.remove('maximized')
					// 还原时不清空内联圆角，让 CSS 的卡片圆角生效
					card.style.borderRadius = ''
					state.left = 0
					state.top = 0
					state.scale = 1
					state.angle = 0
					applyTransform(card, state)

					requestAnimationFrame(() => {
						requestAnimationFrame(runMinimize)
					})
					return
				}

				runMinimize()
			}

			function toggleMaximize(card) {
				const state = cardStates.get(card)
				if (!state || state.closing) return

				if (state.maximized) {
					restoreFromMaximize(card, state)
				} else {
					maximizeCard(card, state)
				}
			}

			function maximizeCard(card, state) {
				state.beforeMaximize = {
					left: state.left,
					top: state.top,
					scale: state.scale ?? 1,
					width: card.offsetWidth,
					height: card.offsetHeight,
					angle: state.angle ?? 0
				}

				card.classList.add('maximized')
				card.style.left = '0px'
				card.style.top = '0px'
				card.style.width = `${window.innerWidth}px`
				card.style.height = `${window.innerHeight}px`
				card.style.borderRadius = '0'

				state.left = 0
				state.top = 0
				state.scale = 1
				state.angle = 0
				applyTransform(card, state)
				activeMaximizedCard = card
				bringToFront(card)
				state.maximized = true
			}

			function restoreFromMaximize(card, state) {
				const previous = state.beforeMaximize
				if (!previous) return

				card.classList.remove('maximized')
				card.style.left = `${previous.left}px`
				card.style.top = `${previous.top}px`
				card.style.width = `${previous.width}px`
				card.style.height = `${previous.height}px`
				card.style.borderRadius = '12px'

				state.left = previous.left
				state.top = previous.top
				state.scale = previous.scale ?? 1
				state.angle = previous.angle ?? state.angle ?? 0
				applyTransform(card, state)
				state.maximized = false
				if (activeMaximizedCard === card) {
					activeMaximizedCard = null
				}
				bringToFront(card)
				state.lastPosition = { left: state.left, top: state.top }

				setTimeout(() => {
					if (!state.maximized) {
						card.style.width = ''
						card.style.height = ''
						state.width = card.offsetWidth
						state.height = card.offsetHeight
					}
				}, 360)
			}


			function createCard() {
				const card = document.createElement('div')
				card.className = 'card'

				const color = randomFrom(colors)
				const angle = (Math.random() - 0.5) * 8
				const cardWidth = 180
				const cardHeight = 122
				const horizontalMargin = 10
				const verticalMargin = 10
				const left =
					horizontalMargin +
					Math.random() *
						Math.max(window.innerWidth - cardWidth - horizontalMargin * 2, 0)
				const top =
					verticalMargin +
					Math.random() *
						Math.max(window.innerHeight - cardHeight - verticalMargin * 2, 0)

				// 只改底色，保留 CSS 里叠在底色的冰面反光渐变
				card.style.backgroundColor = color
				card.style.left = `${left}px`
				card.style.top = `${top}px`
				if (activeMaximizedCard && zIndexCursor >= MAXIMIZED_LAYER - 2) {
					zIndexCursor = MAXIMIZED_LAYER - 2
				}
				card.style.zIndex = ++zIndexCursor

				card.innerHTML = `
					<div class="card-body">${randomFrom(messages)}</div>
				`

				const state = {
					angle,
					scale: 0.9,
					translateX: 0,
					translateY: 0,
					left,
					top,
					maximized: false,
					closing: false,
					lastPosition: { left, top }
				}

				cardStates.set(card, state)
				applyTransform(card, state)
				board.appendChild(card)

				state.width = card.offsetWidth
				state.height = card.offsetHeight

				requestAnimationFrame(() => {
					state.scale = 1
					applyTransform(card, state)
					card.style.opacity = '1'
				})

				setupCardInteractions(card)

				if (board.children.length > maxCards) {
					const oldest = board.firstElementChild
					if (oldest && oldest !== card) {
						oldest.remove()
					}
				}
			}

			// 开始生成卡片的函数
			function startCardGeneration() {
				// 清空之前的定时器
				currentAnimationTimeouts.forEach(timeout => clearTimeout(timeout))
				currentAnimationTimeouts = []

				// 按均匀节奏生成卡片直到汇聚开始
				for (let delay = 0; delay < heartGatherDelay; delay += spawnInterval) {
					const timeout = setTimeout(() => {
						if (!animationTriggered) {
							createCard()
						}
					}, delay)
					currentAnimationTimeouts.push(timeout)
				}

				// 到达汇聚时间后触发爱心动画
				const heartTimeout = setTimeout(() => {
					triggerHeartAnimation()
				}, heartGatherDelay)
				currentAnimationTimeouts.push(heartTimeout)
			}

			// 重置并重新开始动画
			function resetAndRestartAnimation() {
				// 清除所有定时器
				currentAnimationTimeouts.forEach(timeout => clearTimeout(timeout))
				currentAnimationTimeouts = []

				// 重置动画标志
				animationTriggered = false

				// 清除所有卡片
				const allCards = document.querySelectorAll('.card')
				allCards.forEach(card => {
					card.style.transition = 'opacity 0.3s ease'
					card.style.opacity = '0'
					setTimeout(() => card.remove(), 300)
				})

				// 重置 zIndex
				zIndexCursor = 200
				activeMaximizedCard = null

				// 延迟一点后重新开始动画
				setTimeout(() => {
					startCardGeneration()
				}, 500)
			}

			// 雪花效果
			;(() => {
				const canvas = document.getElementById('snowCanvas')
				const ctx = canvas.getContext('2d')
				const mobile = isMobileDevice
				let width = 0
				let height = 0
				let dpr = 1
				let flakes = []
				let rafId = null

				// 按屏幕面积决定雪花数量，移动端更克制一些
				function getFlakeCount() {
					const budget = (width * height) / (mobile ? 13000 : 9000)
					return Math.round(clamp(budget, mobile ? 40 : 60, mobile ? 110 : 220))
				}

				function createFlake(randomY = true) {
					const radius = Math.random() * 2.4 + 1.2
					return {
						x: Math.random() * width,
						y: randomY ? Math.random() * height : -radius * 4,
						radius,
						speedY: radius * 0.45 + Math.random() * 0.6,
						speedX: (Math.random() - 0.5) * 0.35,
						drift: Math.random() * Math.PI * 2,
						driftSpeed: 0.006 + Math.random() * 0.012,
						alpha: 0.25 + Math.random() * 0.55
					}
				}

				function buildFlakes() {
					flakes = Array.from({ length: getFlakeCount() }, () => createFlake(true))
				}

				function resizeCanvas() {
					dpr = Math.min(window.devicePixelRatio || 1, 2) // 限制像素比，保证移动端性能
					width = window.innerWidth
					height = window.innerHeight
					canvas.width = Math.floor(width * dpr)
					canvas.height = Math.floor(height * dpr)
					canvas.style.width = width + 'px'
					canvas.style.height = height + 'px'
					ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
					buildFlakes()
				}

				function draw() {
					ctx.clearRect(0, 0, width, height)
					ctx.fillStyle = '#ffffff'

					for (const flake of flakes) {
						flake.drift += flake.driftSpeed
						// 横向摆动 + 基础风速，形成自然的飘落轨迹
						flake.x += flake.speedX + Math.sin(flake.drift) * 0.35
						flake.y += flake.speedY

						if (flake.y - flake.radius > height) {
							Object.assign(flake, createFlake(false))
						}
						if (flake.x < -8) flake.x = width + 8
						if (flake.x > width + 8) flake.x = -8

						ctx.globalAlpha = flake.alpha
						ctx.beginPath()
						ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2)
						ctx.fill()
					}

					ctx.globalAlpha = 1
					rafId = requestAnimationFrame(draw)
				}

				function start() {
					if (rafId !== null) return
					rafId = requestAnimationFrame(draw)
				}

				function stop() {
					if (rafId === null) return
					cancelAnimationFrame(rafId)
					rafId = null
				}

				resizeCanvas()
				start()

				let resizeTimer = null
				window.addEventListener('resize', () => {
					clearTimeout(resizeTimer)
					resizeTimer = setTimeout(resizeCanvas, 150)
				})

				// 页面不可见时暂停渲染，省移动端电量
				document.addEventListener('visibilitychange', () => {
					if (document.hidden) {
						stop()
					} else {
						start()
					}
				})
			})()

			window.addEventListener('resize', () => {
				const stillMobile =
					window.matchMedia('(pointer: coarse)').matches ||
					window.innerWidth <= 768
				if (!stillMobile) {
					window.location.replace('index.html')
					return
				}

				document.body.classList.add('is-mobile')

				document.querySelectorAll('.card.maximized').forEach(card => {
					card.style.width = `${window.innerWidth}px`
					card.style.height = `${window.innerHeight}px`
				})
			})
		</script>
	</body>

</html>
